[project]
name = "molu-character-lora"
version = "0.1.0"
description = "Small, source-backed character LoRA experiments; not production adapters"
requires-python = "==3.11.*"
dependencies = [
  "torch==2.8.0",
  "transformers==4.56.2",
  "peft==0.17.1",
  "accelerate==1.10.1",
]

[project.optional-dependencies]
qlora = ["bitsandbytes==0.47.0; sys_platform == 'linux'"]

[tool.uv]
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
